spring:
  application:
    name: lendora-users
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none            # se define por perfil (dev/prod)
    properties:
      "[hibernate.jdbc.time_zone]": UTC
      "[hibernate.format_sql]": true
      "[hibernate.default_schema]": public

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

lendora:
  security:
    jwt:
      issuer: ${AUTH_ISSUER:http://localhost:8080}
      expected-audience: users-service

  services:
    audit:
      service-name: users-service
      base-url: ${AUDIT_BASE_URL:http://audit:8080}
      connect-timeout-ms: 1000
      read-timeout-ms: 1500